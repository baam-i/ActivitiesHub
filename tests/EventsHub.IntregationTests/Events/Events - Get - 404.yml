info:
  name: Events - Get - 404
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events/:eventsId"
  params:
    - name: eventsId
      value: Non-existing-event
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 404 NOT FOUND", function() {
          expect(res.getStatus()).to.equal(404);
        });

        test("Response returns an array", function() {
          const body = res.getBody();
          expect(body).to.be.equal("The event was not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
